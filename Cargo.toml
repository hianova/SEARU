[package]
name = "SEARU"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"
description = "Universal Generative Design & R&D Suite (Non-Commercial Source License)"

[dependencies]
rand = "0.9.0"
hound = "3.5.1"
axum = "0.7"
tokio = { version = "1.37", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12.0"
midly = "0.5.3"
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures = "0.3.34"
vec101 = { path = "src/vec101" }
covopt-macro = { path = "../covopt-analyzer/covopt-macro" }
script_go = { path = "src/ScriptGo" }

[workspace]
members = [
    ".",
    "src/vec101",
    "src/no_std_tool",
    "src/ScriptGo"
]

[workspace.dependencies]
rand = "0.9.0"
rayon = "1.12.0"
heapless = "0.8"
ahash = "0.8"
hashbrown = "0.14"
criterion = "0.5"
no_std_tool = { path = "src/no_std_tool" }
covopt-macro = { path = "../covopt-analyzer/covopt-macro" }
serde = { version = "1.0" }
serde_json = "1.0"
num_cpus = "1.0"
rkyv = "0.7"
arc-swap = "1.6"
tokio = "1.37"
