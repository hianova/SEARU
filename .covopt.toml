version = 3

[assurance]
mode = "adaptive"
overall_coverage = 0.90
critical_coverage = 1.0
performance_coverage = 0.90
budget_seconds = 30
planner = "hybrid"
fail_on_critical_unknown = true

[providers]
static = "required"
mca = "auto"
coverage = "fallback"
sanitizer = "fallback"
concurrency = "fallback"
profile = "fallback"
temporal = "auto"
relational = "auto"
adversarial = "auto"

[optimization]
enabled = ["inputs", "atomic", "codegen", "layout"]
default_budget_seconds = 30
apply = "never"

[targets]
discover = "annotations"

[policy.default]
overall_coverage = 0.90
critical_coverage = 1.0

[optimization.codegen]
max_candidates = 32

[optimization.layout]
max_candidates = 32
cache_line_bytes = 64
allow_public_abi_suggestions = false

# Autonomous convergence defaults. This grants workspace apply authority, not
# git commit/push or external side effects.
[converge]
authority = "apply"

[converge.budget]
wall_time_ms = 30000
max_iterations = 8

